name: B3D Blender alternative experiment

on:
  workflow_dispatch:
  push:
    branches: [experiment/b3d2glb-batch-conversion]
    paths:
      - '.github/workflows/b3d-blender-alternative.yml'
      - 'tools/b3d-blender-experiment/**'

permissions:
  contents: read

jobs:
  blender:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
          blender --background --factory-startup --python-expr "import numpy; print('NumPy',numpy.__version__)"
          blender --background --factory-startup --python-expr "import bpy; print('Blender', bpy.app.version_string)"
      - name: Fetch official Mineclonia and animated B3D importer
        run: |
          git clone --depth 1 https://codeberg.org/mineclonia/mineclonia.git /tmp/mineclonia
          git clone --depth 1 https://github.com/AvengerAnubis/b3d2blender.git /tmp/io_scene_b3d
          git -C /tmp/mineclonia rev-parse HEAD > mineclonia-source-sha.txt
          git -C /tmp/io_scene_b3d rev-parse HEAD > blender-importer-sha.txt
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/io_scene_b3d/import_b3d.py')
          src=p.read_text()
          old='action.fcurve_ensure_for_datablock(arm_obj, '
          assert src.count(old)==3, 'Unexpected importer API; refusing blind patch'
          src=src.replace(old, 'action.fcurves.new(')
          src=src.replace('index=axis, group_name=bone.name)', 'index=axis, action_group=bone.name)')
          p.write_text(src)
          PY
      - name: Convert all B3D with Blender
        run: |
          mkdir -p output reports
          set +e
          blender --background --factory-startup --python tools/b3d-blender-experiment/convert.py -- /tmp/mineclonia output reports/blender.json > /tmp/b3d-blender-full.log 2>&1
          code=$?
          set -e
          python3 tools/b3d-blender-experiment/summarize.py reports/blender.json "$code" > reports/diagnostic-summary.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('reports/diagnostic-summary.json').read_text())
          print('SAFE_DIAGNOSTIC_SUMMARY',json.dumps(d,ensure_ascii=True))
          PY
          exit "$code"
      - name: Upload results even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mineclonia-blender-b3d-glb-experiment
          path: |
            output/
            reports/
            mineclonia-source-sha.txt
            blender-importer-sha.txt
          retention-days: 14
          if-no-files-found: warn
