name: Sync Mineclonia 3D profiles

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Texture Studio
        uses: actions/checkout@v4
        with:
          path: studio
      - name: Checkout Mineclonia upstream
        uses: actions/checkout@v4
        with:
          repository: mineclonia-mirror/mineclonia
          path: mineclonia
          fetch-depth: 1
      - name: Extract node faces
        working-directory: studio
        run: node scripts/extract-luanti-node-faces.mjs ../mineclonia/mods > js/data/node-faces.json
      - name: Generate preview profiles
        working-directory: studio
        run: node scripts/generate-preview3d-profiles.mjs js/data/node-faces.json js/data/preview3d-profiles.generated.json
      - name: Commit generated data
        working-directory: studio
        run: |
          if git diff --quiet -- js/data/node-faces.json js/data/preview3d-profiles.generated.json; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/data/node-faces.json js/data/preview3d-profiles.generated.json
          git commit -m "chore: sync Mineclonia 3D profiles"
          git push
