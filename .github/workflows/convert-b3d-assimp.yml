name: Convert B3D with Assimp

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/models-src/**'
      - '.github/workflows/convert-b3d-assimp.yml'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Assimp CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y assimp-utils
          assimp version
          assimp help export
      - name: Convert Piglin B3D to GLB
        run: |
          mkdir -p assets/models-assimp
          assimp export assets/models-src/mobs_mc_piglin.b3d assets/models-assimp/mobs_mc_piglin.glb -f glb2
          test -s assets/models-assimp/mobs_mc_piglin.glb
          file assets/models-assimp/mobs_mc_piglin.glb
          ls -lh assets/models-assimp/mobs_mc_piglin.glb
      - name: Commit converted model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/models-assimp/mobs_mc_piglin.glb
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: convert Piglin B3D with Assimp [skip ci]"
          git push
