name: One-shot reference-first prompt migration

on:
  push:
    branches: [main]
    paths:
      - scripts/one-shot-reference-first-prompts.mjs
      - .github/workflows/one-shot-reference-first-prompts.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply migration
        run: node scripts/one-shot-reference-first-prompts.mjs
      - name: Validate runtime guards
        run: node scripts/check-runtime-overrides.mjs
      - name: Remove one-shot helpers
        run: |
          git rm scripts/one-shot-reference-first-prompts.mjs
          git rm .github/workflows/one-shot-reference-first-prompts.yml
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html AGENTS.md PROMPT_AUTHORING_GUIDE.md SESSION_HANDOFF.md
          git commit -m "feat: switch P0 to reference-first prompts"
          git push
