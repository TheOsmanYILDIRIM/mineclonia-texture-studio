name: Import MTS item prompts

on:
  push:
    paths:
      - 'imports/mts-item-prompt-import.json'

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import bundle
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="imports/mts-item-prompt-import.json"
          test -f "$BUNDLE"
          python3 - "$BUNDLE" <<'PY'
          import json, pathlib, re, sys
          bundle_path=pathlib.Path(sys.argv[1])
          bundle=json.loads(bundle_path.read_text())
          rows=bundle.get("prompts",[])
          if not rows:
              raise SystemExit("bundle has no prompts")
          out=pathlib.Path("prompts/items")
          out.mkdir(parents=True,exist_ok=True)
          seen=set()
          for obj in rows:
              item_id=obj.get("id","")
              if not re.fullmatch(r"tex_[0-9a-f]{10}",item_id) or item_id in seen:
                  raise SystemExit(f"invalid/duplicate id: {item_id}")
              seen.add(item_id)
              for key in ("path","name","creative_prompt","correction_prompt"):
                  if not isinstance(obj.get(key),str) or not obj[key].strip():
                      raise SystemExit(f"{item_id}: invalid {key}")
              record={"schema_version":1,"kind":"item_two_pass",**obj}
              (out/f"{item_id}.json").write_text(json.dumps(record,indent=2,ensure_ascii=False)+"\n")
          entries=[]
          records=[]
          for p in out.glob("tex_*.json"):
              obj=json.loads(p.read_text())
              item_id=obj.get("id","")
              if not re.fullmatch(r"tex_[0-9a-f]{10}",item_id):
                  raise SystemExit(f"invalid existing id: {item_id}")
              records.append(obj)
          records.sort(key=lambda o:(o.get("path",""),o["id"]))
          for order,obj in enumerate(records,1):
              entries.append({"order":order,"id":obj["id"],"name":obj["name"],"texture_path":obj["path"],"status":"done","file":f"prompts/items/{obj['id']}.json"})
          manifest={"schema_version":1,"kind":"item_two_pass_manifest","total":len(entries),"done":len(entries),"pending":0,"entries":entries,"batches":[]}
          (out/"manifest.json").write_text(json.dumps(manifest,indent=2,ensure_ascii=False)+"\n")
          PY
          rm -f prompts/items/batch_001_050.json
          rm -rf prompts/items/batch_001_050
          rm -f "$BUNDLE"

      - name: Commit imported prompts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A prompts/items imports
          git diff --cached --quiet && exit 0
          git commit -m "prompts: import item prompt bundle"
          git push
