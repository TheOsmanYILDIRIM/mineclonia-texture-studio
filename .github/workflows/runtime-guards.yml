name: Runtime texture guards

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  runtime-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check runtime-winning texture paths
        run: node scripts/check-runtime-overrides.mjs
