name: Runtime texture guards

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: runtime-guards-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runtime-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check runtime-winning texture paths
        run: node scripts/check-runtime-overrides.mjs
      - name: Check architecture standardization
        run: node scripts/check-standardization.mjs
      - name: Verify reversible AI UV grid runtime
        run: |
          node tests/uv-generation-roundtrip.test.mjs
          node scripts/build-uv-generation.mjs --check
      - name: Test UV reversible core
        run: node tests/uv-generation-roundtrip.test.mjs
      - name: Check UV detail production bundle
        run: node scripts/build-uv-detail-grid.mjs --check
      - name: Check B3D skeletal animation regression
        run: node tests/b3d-animation.test.cjs
