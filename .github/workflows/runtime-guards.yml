name: Runtime texture guards

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: runtime-guards-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runtime-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check runtime-winning texture paths
        run: node scripts/check-runtime-overrides.mjs
      - name: Check architecture standardization
        run: node scripts/check-standardization.mjs
      - name: Verify reversible AI UV grid runtime
        run: |
          node tests/uv-generation-roundtrip.test.mjs
          node scripts/build-uv-generation.mjs --check
      - name: Test UV reversible core
        run: node tests/uv-generation-roundtrip.test.mjs
      - name: Check UV detail production bundle
        run: node scripts/build-uv-detail-grid.mjs --check
      - name: Parse regional UV interface modules
        run: |
          node --check js/island-region-studio.mjs
          node --check js/uv-repair-router.js
      - name: Test selected-region UV compositing and alpha preservation
        run: node tests/island-region-core.test.mjs
      - name: Check B3D skeletal animation regression
        run: node tests/b3d-animation.test.cjs
      - name: Check sourced Mineclonia nodeboxes
        run: node tests/preview3d-nodeboxes.test.mjs

  nodebox-geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Mineclonia-sourced nodebox geometry
        run: node tests/preview3d-nodeboxes.test.mjs
      - name: Check preview renderer syntax
        run: |
          node --check js/preview3d.js
          node --check js/preview3d-nodeboxes.mjs

  b3d-rig-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify B3D rig regression and static mesh parity
        run: node tests/b3d-animation.test.cjs
      - name: Check B3D renderer syntax
        run: |
          node --check js/b3d-animation.js
          node --check js/preview3d.js
