name: B3D Assimp alternative experiment

on:
  push:
    branches: [experiment/b3d2glb-batch-conversion]
    paths:
      - '.github/workflows/b3d-assimp-alternative.yml'
      - 'tools/b3d-assimp-alternative/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Assimp and glTF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y assimp-utils libassimp-dev
          python3 -m pip install --break-system-packages pygltflib
          assimp version || true
      - name: Checkout canonical Mineclonia
        run: |
          git clone --depth 1 https://codeberg.org/mineclonia/mineclonia.git /tmp/mineclonia
          git -C /tmp/mineclonia rev-parse HEAD > source-sha.txt
      - name: Convert with independent Assimp importer
        shell: bash
        run: |
          mkdir -p output reports
          python3 tools/b3d-assimp-alternative/convert.py /tmp/mineclonia output reports/assimp.json
      - name: Upload all results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mineclonia-assimp-alternative
          path: |
            output/
            reports/
            source-sha.txt
          retention-days: 14
          if-no-files-found: warn
