name: Build minimal IrrlichtMt WASM viewer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'wasm-viewer/**'
      - '.github/workflows/build-wasm-viewer.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
      - name: Fetch Luanti IrrlichtMt source
        run: |
          rm -rf wasm-viewer/vendor/luanti
          git clone --filter=blob:none --no-checkout https://github.com/paradust7/luanti.git wasm-viewer/vendor/luanti
          cd wasm-viewer/vendor/luanti
          git checkout 038b341fe861370433aea8eb6317f0bbd87303ba -- irr lib/tiniergltf
          python3 - <<'PY'
          from pathlib import Path
          p=Path('irr/src/CMakeLists.txt')
          lines=p.read_text().splitlines()
          lines=[line for line in lines if 'CGLTFMeshFileLoader' not in line]
          p.write_text('\\n'.join(lines)+'\\n')
          assert 'CGLTFMeshFileLoader' not in p.read_text()
          PY
          ! grep -n 'CGLTFMeshFileLoader' irr/src/CMakeLists.txt
      - name: Configure
        working-directory: wasm-viewer
        env:
          CFLAGS: "-sUSE_ZLIB=1 -sUSE_LIBPNG=1 -sUSE_LIBJPEG=1 -sUSE_SDL=2"
          CXXFLAGS: "-sUSE_ZLIB=1 -sUSE_LIBPNG=1 -sUSE_LIBJPEG=1 -sUSE_SDL=2"
          LDFLAGS: "-sUSE_ZLIB=1 -sUSE_LIBPNG=1 -sUSE_LIBJPEG=1 -sUSE_SDL=2"
        run: |
          embuilder build zlib libpng libjpeg sdl2
          printf '' > /tmp/egl_stub.c
          emcc -c /tmp/egl_stub.c -o /tmp/egl_stub.o
          emcmake cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DENABLE_OPENGL3=OFF -DENABLE_GLES2=ON -DEGL_LIBRARY=/tmp/egl_stub.o -DEGL_INCLUDE_DIR=$EMSDK/upstream/emscripten/cache/sysroot/include
      - name: Build
        working-directory: wasm-viewer
        env:
          CFLAGS: "-sUSE_ZLIB=1 -sUSE_LIBPNG=1 -sUSE_LIBJPEG=1 -sUSE_SDL=2"
          CXXFLAGS: "-sUSE_ZLIB=1 -sUSE_LIBPNG=1 -sUSE_LIBJPEG=1 -sUSE_SDL=2"
          LDFLAGS: "-sUSE_ZLIB=1 -sUSE_LIBPNG=1 -sUSE_LIBJPEG=1 -sUSE_SDL=2"
        run: cmake --build build -j2
      - name: Stage web runtime
        run: |
          mkdir -p assets/wasm-viewer
          cp wasm-viewer/build/b3d_viewer.js assets/wasm-viewer/
          cp wasm-viewer/build/b3d_viewer.wasm assets/wasm-viewer/
          ls -lh assets/wasm-viewer/
      - name: Commit generated runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/wasm-viewer
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: generate minimal IrrlichtMt WASM viewer [skip ci]"
          git push
