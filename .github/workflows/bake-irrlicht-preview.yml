name: Bake Irrlicht B3D preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/models-src/**'
      - 'tools/bake_b3d_preview.cpp'
      - '.github/workflows/bake-irrlicht-preview.yml'

permissions:
  contents: write

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Irrlicht
        run: sudo apt-get update && sudo apt-get install -y libirrlicht-dev
      - name: Build baker
        run: g++ -std=c++17 -O2 tools/bake_b3d_preview.cpp -I/usr/include/irrlicht -lIrrlicht -o /tmp/bake_b3d_preview
      - name: Bake Piglin stand preview
        run: |
          mkdir -p assets/models-preview
          /tmp/bake_b3d_preview assets/models-src/mobs_mc_piglin.b3d assets/models-preview/mobs_mc_piglin.obj 20
          ls -lh assets/models-preview/mobs_mc_piglin.obj
      - name: Commit preview mesh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/models-preview/mobs_mc_piglin.obj
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: bake Piglin preview with Irrlicht [skip ci]"
          git push
