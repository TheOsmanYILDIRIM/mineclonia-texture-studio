name: Convert B3D models to GLB

on:
  push:
    branches: [main]
    paths:
      - 'assets/models-src/**'
      - '.github/workflows/convert-b3d.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install b3d2glb
        run: cargo install b3d2glb --version 0.4.5 --locked

      - name: Convert models with skinning and animations
        run: |
          mkdir -p assets/models
          b3d2glb -b -o assets/models assets/models-src
          ls -lh assets/models

      - name: Commit generated GLB
        run: |
          if git diff --quiet -- assets/models && [ -z "$(git status --porcelain assets/models)" ]; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/models
          git commit -m "build: convert B3D models to GLB [skip ci]"
          git push
