name: Convert B3D models to GLB

on:
  push:
    branches: [main]
    paths:
      - 'assets/models-src/**'
      - '.github/workflows/convert-b3d.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Assimp
        run: |
          sudo apt-get update
          sudo apt-get install -y assimp-utils
      - name: Convert models
        run: |
          mkdir -p assets/models
          shopt -s nullglob
          for f in assets/models-src/*.b3d; do
            name="$(basename "$f" .b3d)"
            assimp export "$f" "assets/models/$name.glb" -f glb2
          done
          ls -lh assets/models
      - name: Commit generated GLB
        run: |
          if git diff --quiet -- assets/models && [ -z "$(git status --porcelain assets/models)" ]; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/models
          git commit -m "build: convert B3D models to GLB [skip ci]"
          git push
