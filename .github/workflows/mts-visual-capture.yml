name: MTS visual capture

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mts-visual-capture.yml"
      - "index.html"
      - "css/**"
      - "js/**"
      - "model-studio/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Capture live Texture Studio
        run: |
          cat > capture.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const base = 'https://theosmanyildirim.github.io/mineclonia-texture-studio/';
          const out = 'visual-review';
          fs.mkdirSync(out, { recursive: true });

          const targets = [
            { name: 'mobile', width: 390, height: 844 },
            { name: 'tablet', width: 768, height: 1024 },
            { name: 'desktop', width: 1440, height: 1000 }
          ];

          const browser = await chromium.launch({ headless: true });

          for (const t of targets) {
            const page = await browser.newPage({
              viewport: { width: t.width, height: t.height },
              deviceScaleFactor: 1
            });

            const consoleErrors = [];
            const pageErrors = [];
            page.on('console', msg => {
              if (msg.type() === 'error') consoleErrors.push(msg.text());
            });
            page.on('pageerror', err => pageErrors.push(String(err)));

            let loaded = false;
            let lastError = null;
            for (let attempt = 1; attempt <= 6 && !loaded; attempt++) {
              try {
                await page.goto(base + '?visualReview=' + Date.now(), {
                  waitUntil: 'domcontentloaded',
                  timeout: 30000
                });
                await page.waitForLoadState('networkidle', { timeout: 15000 }).catch(() => {});
                await page.waitForFunction(() => document.body && document.body.innerText.length > 80, null, { timeout: 15000 });
                await page.waitForTimeout(5000);
                loaded = true;
              } catch (err) {
                lastError = err;
                if (attempt < 6) await page.waitForTimeout(10000);
              }
            }
            if (!loaded) throw new Error('Live MTS did not become ready: ' + lastError);

            await page.screenshot({ path: `${out}/home-${t.name}-fold.png`, fullPage: false });

            await page.evaluate(async () => {
              const height = document.documentElement.scrollHeight;
              for (let y = 0; y < height; y += 700) {
                window.scrollTo(0, y);
                await new Promise(r => setTimeout(r, 70));
              }
              window.scrollTo(0, 0);
            });
            await page.waitForTimeout(500);
            await page.screenshot({ path: `${out}/home-${t.name}-full.png`, fullPage: true });

            fs.writeFileSync(
              `${out}/diagnostics-${t.name}.json`,
              JSON.stringify({
                url: page.url(),
                viewport: t,
                title: await page.title(),
                bodyHeight: await page.evaluate(() => document.documentElement.scrollHeight),
                consoleErrors,
                pageErrors
              }, null, 2)
            );

            await page.close();
          }

          await browser.close();
          EOF
          node capture.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: mts-visual-review
          path: visual-review/*
          retention-days: 7
