name: MTS visual capture

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mts-visual-capture.yml"
      - "index.html"
      - "css/**"
      - "js/**"
      - "model-studio/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Capture live Texture Studio
        run: |
          cat > capture.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const base = 'https://theosmanyildirim.github.io/mineclonia-texture-studio/';
          const out = 'visual-review';
          fs.mkdirSync(out, { recursive: true });

          const targets = [
            { name: 'mobile', width: 390, height: 844 },
            { name: 'tablet', width: 768, height: 1024 },
            { name: 'desktop', width: 1440, height: 1000 }
          ];

          const browser = await chromium.launch({ headless: true });

          async function waitForLiveBuild() {
            const expected = process.env.GITHUB_SHA;
            let last = '';
            for (let attempt = 1; attempt <= 18; attempt++) {
              try {
                const res = await fetch(base + 'js/build-status.js?probe=' + Date.now(), { cache: 'no-store' });
                last = await res.text();
                if (expected && last.includes(expected)) return;
              } catch {}
              await new Promise(r => setTimeout(r, 10000));
            }
            throw new Error('Pages did not publish expected build ' + expected + ' · last=' + last.slice(0, 160));
          }

          await waitForLiveBuild();

          async function openReady(page, url, readySelector) {
            let loaded = false;
            let lastError = null;
            for (let attempt = 1; attempt <= 6 && !loaded; attempt++) {
              try {
                await page.goto(url, {
                  waitUntil: 'domcontentloaded',
                  timeout: 30000
                });
                await page.waitForLoadState('networkidle', { timeout: 15000 }).catch(() => {});
                if (readySelector) {
                  await page.waitForSelector(readySelector, { state: 'visible', timeout: 15000 });
                } else {
                  await page.waitForFunction(
                    () => document.body && document.body.innerText.length > 80,
                    null,
                    { timeout: 15000 }
                  );
                }
                await page.waitForTimeout(2500);
                loaded = true;
              } catch (err) {
                lastError = err;
                if (attempt < 6) await page.waitForTimeout(10000);
              }
            }
            if (!loaded) throw new Error('Live MTS did not become ready: ' + lastError);
          }

          async function capture(page, name, fullPage = false) {
            await page.screenshot({ path: `${out}/${name}.png`, fullPage });
          }

          for (const t of targets) {
            const page = await browser.newPage({
              viewport: { width: t.width, height: t.height },
              deviceScaleFactor: 1
            });

            const consoleErrors = [];
            const pageErrors = [];
            const stateErrors = [];
            page.on('console', msg => {
              if (msg.type() === 'error') consoleErrors.push(msg.text());
            });
            page.on('pageerror', err => pageErrors.push(String(err)));

            await openReady(page, base + '?visualReview=' + Date.now(), '#grid .card');

            await capture(page, `home-${t.name}-fold`);
            await page.evaluate(async () => {
              const height = document.documentElement.scrollHeight;
              for (let y = 0; y < height; y += 700) {
                window.scrollTo(0, y);
                await new Promise(r => setTimeout(r, 70));
              }
              window.scrollTo(0, 0);
            });
            await page.waitForTimeout(350);
            await capture(page, `home-${t.name}-full`, true);

            try {
              await page.locator('#grid .card').first().click();
              await page.waitForSelector('#sheet.open', { timeout: 10000 });
              await page.waitForTimeout(700);
              await capture(page, `detail-${t.name}-fold`);
              try {
                await page.locator('#open3dPreview').evaluate(el => el.click());
                await page.waitForSelector('#preview3d.open', { timeout: 10000 });
                await page.waitForTimeout(800);
                const profileId = await page.locator('#preview3d').getAttribute('data-preview-profile').catch(()=>null);
                stateErrors.push('preview3d-profile:' + t.name + ':' + profileId);
                await capture(page, `preview3d-block-${t.name}-fold`);
                const surfaceToggle = page.locator('#preview3dSurfaceToggle');
                if (await surfaceToggle.isVisible().catch(() => false)) {
                  await surfaceToggle.evaluate(el => el.click());
                  await page.waitForTimeout(600);
                  await capture(page, `preview3d-surface-${t.name}-fold`);
                }
                await page.locator('#preview3dClose').evaluate(el => el.click());
              } catch (err) {
                stateErrors.push('preview3d: ' + String(err));
              }

              await page.evaluate(() => document.querySelector('#sheet')?.classList.remove('open'));
            } catch (err) {
              stateErrors.push('detail: ' + String(err));
            }

            try {
              const search = page.locator('#search');
              await search.fill('mcl_core_bone_block_side');
              await page.waitForTimeout(500);
              const boneCard = page.locator('#grid .card').filter({ hasText: 'mcl_core_bone_block_side' }).first();
              if (await boneCard.count()) {
                await boneCard.click();
                await page.waitForSelector('#sheet.open', { timeout: 10000 });
                await page.locator('#open3dPreview').evaluate(el => el.click());
                await page.waitForSelector('#preview3d.open', { timeout: 10000 });
                await page.waitForTimeout(900);
                const boneProfile = await page.locator('#preview3d').getAttribute('data-preview-profile');
                if (boneProfile !== 'node:mcl_core:bone_block') stateErrors.push('bone-profile:' + String(boneProfile));
                await capture(page, `preview3d-bone-${t.name}-fold`);
                await page.locator('#preview3dClose').evaluate(el => el.click());
                await page.evaluate(() => document.querySelector('#sheet')?.classList.remove('open'));
              } else {
                stateErrors.push('bone-card:not-found');
              }
              await search.fill('');
              await page.waitForTimeout(350);
            } catch (err) {
              stateErrors.push('bone-preview:' + String(err));
            }

            try {
              try {
                await page.locator('#openVariantLab').click({ timeout: 3000 });
              } catch (err) {
                stateErrors.push('variant-lab-pointer: ' + String(err));
                await page.locator('#openVariantLab').evaluate(el => el.click());
              }
              await page.waitForSelector('#variantLab.open', { timeout: 10000 });
              await page.waitForTimeout(700);
              await capture(page, `variant-lab-${t.name}-fold`);

              const entityId = await page.evaluate(() => {
                const api = window.MTSVariantBridge;
                const all = api?.catalog?.() || [];
                const entity = all.find(x => api.assetTypeOf?.(x) === 'Entity' && /\\.b3d/i.test(String(api.runtimeRoleInfo?.(x)?.model || '')))
                  || all.find(x => api.assetTypeOf?.(x) === 'Entity');
                return entity?.id || null;
              });

              if (entityId) {
                try {
                  await page.evaluate(async id => {
                    const api = window.MTSVariantBridge;
                    const meta = (api?.catalog?.() || []).find(x => x.id === id);
                    if (!meta) throw new Error('Entity metadata missing');
                    await window.MTSVariantLab.open(meta);
                    await window.MTSUvRepair.openPrimary();
                  }, entityId);
                  await page.waitForSelector('.vertexUvStudio.open', { timeout: 10000 });
                  await page.waitForTimeout(700);
                  await capture(page, `vertex-uv-${t.name}-fold`);
                  await page.evaluate(() => document.querySelector('.vertexUvStudio')?.classList.remove('open'));
                } catch (err) {
                  stateErrors.push('vertex-uv-state: ' + String(err));
                }

                try {
                  await page.evaluate(async id => {
                    const api = window.MTSVariantBridge;
                    const meta = (api?.catalog?.() || []).find(x => x.id === id);
                    if (!meta) throw new Error('Entity metadata missing');
                    document.querySelector('#variantLab')?.classList.remove('open');
                    await window.MTSUvRepair.openIsland(meta.path);
                  }, entityId);
                  await page.waitForSelector('#regionalUvStudio.open', { timeout: 10000 });
                  await page.waitForFunction(() => document.querySelector('#regionUvCanvas')?.width > 1, null, { timeout: 15000 });
                  await page.waitForTimeout(350);
                  await capture(page, `island-studio-${t.name}-fold`);

                  const inputPng = await page.evaluate(() => {
                    const c = document.createElement('canvas');
                    c.width = 64; c.height = 64;
                    const g = c.getContext('2d');
                    g.fillStyle = '#ef354c'; g.fillRect(0,0,64,64);
                    return c.toDataURL('image/png').split(',')[1];
                  });
                  // Explicitly choose target UV rectangle first; never use entire atlas implicitly.
                  const dragCanvas = async (left, top, right, bottom) => {
                    await page.locator('#regionUvCanvas').scrollIntoViewIfNeeded();
                    const r = await page.locator('#regionUvCanvas').boundingBox();
                    if (!r) throw new Error('Regional canvas missing');
                    await page.mouse.move(r.x + r.width * left, r.y + r.height * top);
                    await page.mouse.down();
                    await page.mouse.move(r.x + r.width * right, r.y + r.height * bottom, { steps: 5 });
                    await page.mouse.up();
                  };
                  const targetBox = await page.evaluate(() => {
                    const cv = document.querySelector('#regionUvCanvas'),w=cv.width,h=cv.height;
                    const data=cv.getContext('2d').getImageData(0,0,w,h).data;
                    let best=null,score=Infinity;
                    for(let y=0;y<h;y++)for(let x=0;x<w;x++){
                      if(data[(y*w+x)*4+3] < 128)continue;
                      const px=x/w,py=y/h;
                      const penalty=(px<.22||py<.12)?100:0;
                      const d=(px-.5)**2+(py-.5)**2+penalty;
                      if(d<score){score=d;best={x,y}}
                    }
                    if(!best)throw new Error('No opaque entity pixel for regional UV test');
                    const sizeX=Math.max(3,Math.round(w*.12)),sizeY=Math.max(3,Math.round(h*.12));
                    const x0=Math.max(0,Math.min(w-2,best.x-Math.floor(sizeX/2)));
                    const y0=Math.max(0,Math.min(h-2,best.y-Math.floor(sizeY/2)));
                    return {left:(x0+.1)/w,top:(y0+.1)/h,right:(Math.min(w-1,x0+sizeX)+.1)/w,bottom:(Math.min(h-1,y0+sizeY)+.1)/h};
                  });
                  await dragCanvas(targetBox.left,targetBox.top,targetBox.right,targetBox.bottom);
                  // Joystick pixel presets are explicit and retain the existing slow repeat cadence.
                  await page.locator('[data-region-step="4"]').click();
                  if (await page.locator('[data-region-step="4"]').getAttribute('aria-pressed') !== 'true') throw new Error('4px joystick step not selected');
                  if (!(await page.locator('#regionUvHandleStatus').textContent()).includes('4 px / adım')) throw new Error('4px joystick step status not updated');
                  await page.locator('[data-region-step="1"]').click();
                  if (await page.locator('[data-region-step="1"]').getAttribute('aria-pressed') !== 'true') throw new Error('1px precision mode not restorable');

                  // Existing saved rectangles should render as thumbnails derived from active UV.
                  await page.locator('.regionUvSaved').evaluate(el => { el.open = true; });
                  await page.locator('#regionUvAddIsland').click();
                  await page.locator('#regionUvAdd').click();
                  const islandCard = page.locator('#regionUvIslandGallery .regionUvIslandCard.selected').first();
                  if (await islandCard.count() !== 1) throw new Error('Saved island thumbnail card missing');
                  const rendered = await islandCard.locator('canvas').evaluate(cv => {
                    if (cv.width !== 72 || cv.height !== 72) return false;
                    const pixels = cv.getContext('2d').getImageData(0, 0, cv.width, cv.height).data;
                    for (let i = 3; i < pixels.length; i += 4) if (pixels[i] > 0) return true;
                    return false;
                  });
                  if (!rendered) throw new Error('Saved island thumbnail is empty for visible UV region');
                  await capture(page, `regional-uv-islands-${t.name}-fold`);
                  await islandCard.click();
                  await page.locator('.regionUvSaved').evaluate(el => { el.open = false; });

                  await page.locator('#regionUvFile').setInputFiles({
                    name: 'regional-red-test.png',
                    mimeType: 'image/png',
                    buffer: Buffer.from(inputPng, 'base64')
                  });
                  await page.waitForFunction(() => document.querySelector('#regionUvStatus')?.textContent?.includes('Yüklenen PNG üzerinde'), null, { timeout: 15000 }).catch(async err => { throw new Error('Import selection did not open: ' + await page.locator('#regionUvStatus').textContent() + ' / ' + err.message); });
                  if (await page.locator('.regionUvHandles button').count() || await page.locator('#regionUvLeft').count()) {
                    throw new Error('Obsolete arrow/corner button cluster still present');
                  }
                  if (await page.locator('.regionUvModeRail button[data-region-tool]').count() !== 2) throw new Error('Pan/Edit mini rail missing');
                  if (await page.locator('#regionUvSave').isEnabled()) throw new Error('Saved-enabled before source island selection');
                  await dragCanvas(.25,.25,.65,.65);
                  await page.locator('#regionUvPreview').click();
                  await page.waitForFunction(() => (document.querySelector('#regionUvStatus')?.textContent || '').includes('Birleşim hazır'), null, { timeout: 15000 }).catch(async err => { throw new Error('Regional source merge failed: ' + await page.locator('#regionUvStatus').textContent() + ' / ' + err.message); });
                  if (!await page.locator('#regionUvSave').isEnabled()) {
                    const detail = await page.evaluate(() => ({
                      status: document.querySelector('#regionUvStatus')?.textContent,
                      zoom: document.querySelector('#regionUvZoomValue')?.textContent,
                      selection: document.querySelector('#regionUvSelection')?.getAttribute('style')
                    }));
                    throw new Error('Source island did not produce a valid preview: ' + JSON.stringify(detail));
                  }
                  await capture(page, `regional-uv-preview-${t.name}-fold`);
                  // Preview-only smoke test: never click save or mutate user edit data.
                  await page.evaluate(() => document.querySelector('#regionalUvStudio')?.classList.remove('open'));
                } catch (err) {
                  stateErrors.push('island-studio-state: ' + String(err));
                }
              }

              await page.evaluate(() => document.querySelector('#variantLab')?.classList.remove('open'));
            } catch (err) {
              stateErrors.push('variant-lab-state: ' + String(err));
            }

            const layout = await page.evaluate(() => {
              const rect = sel => {
                const el = document.querySelector(sel);
                if (!el) return null;
                const r = el.getBoundingClientRect();
                return { x:r.x, y:r.y, width:r.width, height:r.height };
              };
              const firstCard = document.querySelector('#grid .card');
              return {
                viewport: { width: innerWidth, height: innerHeight },
                bodyHeight: document.documentElement.scrollHeight,
                scrollWidth: document.documentElement.scrollWidth,
                horizontalOverflow: document.documentElement.scrollWidth > innerWidth + 1,
                header: rect('.top'),
                title: rect('.title'),
                controls: rect('.controls'),
                filters: rect('.filterRow'),
                bottomBar: rect('.bottom'),
                firstCard: firstCard ? rect('#grid .card') : null
              };
            });

            fs.writeFileSync(
              `${out}/diagnostics-${t.name}.json`,
              JSON.stringify({
                url: page.url(),
                viewport: t,
                title: await page.title(),
                consoleErrors,
                pageErrors,
                stateErrors,
                layout
              }, null, 2)
            );

            const regionFailures = stateErrors.filter(s => s.startsWith('island-studio-state:'));
            if (regionFailures.length) throw new Error('Regional UV browser smoke failed: ' + regionFailures.join('; '));
            await page.close();
          }

          for (const t of targets) {
            const page = await browser.newPage({
              viewport: { width: t.width, height: t.height },
              deviceScaleFactor: 1
            });
            const errors = [];
            page.on('pageerror', err => errors.push(String(err)));
            try {
              await openReady(page, base + 'model-studio/?visualReview=' + Date.now(), 'body');
              await capture(page, `model-studio-${t.name}-fold`);
            } catch (err) {
              errors.push(String(err));
            }
            fs.writeFileSync(
              `${out}/model-studio-diagnostics-${t.name}.json`,
              JSON.stringify({ url: page.url(), title: await page.title(), errors }, null, 2)
            );
            await page.close();
          }

          await browser.close();
          EOF
          node capture.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: mts-visual-review
          path: visual-review/*
          retention-days: 7
