name: MTS visual capture

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mts-visual-capture.yml"
      - "index.html"
      - "css/**"
      - "js/**"
      - "model-studio/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Capture live Texture Studio
        run: |
          cat > capture.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const base = 'https://theosmanyildirim.github.io/mineclonia-texture-studio/';
          const out = 'visual-review';
          fs.mkdirSync(out, { recursive: true });

          const targets = [
            { name: 'mobile', width: 390, height: 844 },
            { name: 'tablet', width: 768, height: 1024 },
            { name: 'desktop', width: 1440, height: 1000 }
          ];

          const browser = await chromium.launch({ headless: true });

          async function waitForLiveBuild() {
            const expected = process.env.GITHUB_SHA;
            let last = '';
            for (let attempt = 1; attempt <= 18; attempt++) {
              try {
                const res = await fetch(base + 'js/build-status.js?probe=' + Date.now(), { cache: 'no-store' });
                last = await res.text();
                if (expected && last.includes(expected)) return;
              } catch {}
              await new Promise(r => setTimeout(r, 10000));
            }
            throw new Error('Pages did not publish expected build ' + expected + ' · last=' + last.slice(0, 160));
          }

          await waitForLiveBuild();

          async function openReady(page, url, readySelector) {
            let loaded = false;
            let lastError = null;
            for (let attempt = 1; attempt <= 6 && !loaded; attempt++) {
              try {
                await page.goto(url, {
                  waitUntil: 'domcontentloaded',
                  timeout: 30000
                });
                await page.waitForLoadState('networkidle', { timeout: 15000 }).catch(() => {});
                if (readySelector) {
                  await page.waitForSelector(readySelector, { state: 'visible', timeout: 15000 });
                } else {
                  await page.waitForFunction(
                    () => document.body && document.body.innerText.length > 80,
                    null,
                    { timeout: 15000 }
                  );
                }
                await page.waitForTimeout(2500);
                loaded = true;
              } catch (err) {
                lastError = err;
                if (attempt < 6) await page.waitForTimeout(10000);
              }
            }
            if (!loaded) throw new Error('Live MTS did not become ready: ' + lastError);
          }

          async function capture(page, name, fullPage = false) {
            await page.screenshot({ path: `${out}/${name}.png`, fullPage });
          }

          for (const t of targets) {
            const page = await browser.newPage({
              viewport: { width: t.width, height: t.height },
              deviceScaleFactor: 1
            });

            const consoleErrors = [];
            const pageErrors = [];
            const stateErrors = [];
            page.on('console', msg => {
              if (msg.type() === 'error') consoleErrors.push(msg.text());
            });
            page.on('pageerror', err => pageErrors.push(String(err)));

            await openReady(page, base + '?visualReview=' + Date.now(), '#grid .card');

            await capture(page, `home-${t.name}-fold`);
            await page.evaluate(async () => {
              const height = document.documentElement.scrollHeight;
              for (let y = 0; y < height; y += 700) {
                window.scrollTo(0, y);
                await new Promise(r => setTimeout(r, 70));
              }
              window.scrollTo(0, 0);
            });
            await page.waitForTimeout(350);
            await capture(page, `home-${t.name}-full`, true);

            try {
              await page.locator('#grid .card').first().click();
              await page.waitForSelector('#sheet.open', { timeout: 10000 });
              await page.waitForTimeout(700);
              await capture(page, `detail-${t.name}-fold`);
              try {
                await page.locator('#open3dPreview').evaluate(el => el.click());
                await page.waitForSelector('#preview3d.open', { timeout: 10000 });
                await page.waitForTimeout(800);
                await capture(page, `preview3d-block-${t.name}-fold`);
                const surfaceToggle = page.locator('#preview3dSurfaceToggle');
                if (await surfaceToggle.isVisible().catch(() => false)) {
                  await surfaceToggle.evaluate(el => el.click());
                  await page.waitForTimeout(600);
                  await capture(page, `preview3d-surface-${t.name}-fold`);
                }
                await page.locator('#preview3dClose').evaluate(el => el.click());
              } catch (err) {
                stateErrors.push('preview3d: ' + String(err));
              }

              await page.evaluate(() => document.querySelector('#sheet')?.classList.remove('open'));
            } catch (err) {
              stateErrors.push('detail: ' + String(err));
            }

            try {
              try {
                await page.locator('#openVariantLab').click({ timeout: 3000 });
              } catch (err) {
                stateErrors.push('variant-lab-pointer: ' + String(err));
                await page.locator('#openVariantLab').evaluate(el => el.click());
              }
              await page.waitForSelector('#variantLab.open', { timeout: 10000 });
              await page.waitForTimeout(700);
              await capture(page, `variant-lab-${t.name}-fold`);

              const entityId = await page.evaluate(() => {
                const api = window.MTSVariantBridge;
                const all = api?.catalog?.() || [];
                const entity = all.find(x => api.assetTypeOf?.(x) === 'Entity' && /\\.b3d/i.test(String(api.runtimeRoleInfo?.(x)?.model || '')))
                  || all.find(x => api.assetTypeOf?.(x) === 'Entity');
                return entity?.id || null;
              });

              if (entityId) {
                try {
                  await page.evaluate(async id => {
                    const api = window.MTSVariantBridge;
                    const meta = (api?.catalog?.() || []).find(x => x.id === id);
                    if (!meta) throw new Error('Entity metadata missing');
                    await window.MTSVariantLab.open(meta);
                    await window.MTSUvRepair.openPrimary();
                  }, entityId);
                  await page.waitForSelector('.vertexUvStudio.open', { timeout: 10000 });
                  await page.waitForTimeout(700);
                  await capture(page, `vertex-uv-${t.name}-fold`);
                  await page.evaluate(() => document.querySelector('.vertexUvStudio')?.classList.remove('open'));
                } catch (err) {
                  stateErrors.push('vertex-uv-state: ' + String(err));
                }

                try {
                  await page.evaluate(async id => {
                    const api = window.MTSVariantBridge;
                    const meta = (api?.catalog?.() || []).find(x => x.id === id);
                    if (!meta) throw new Error('Entity metadata missing');
                    document.querySelector('#variantLab')?.classList.remove('open');
                    await window.MTSUvRepair.openIsland(meta.path);
                  }, entityId);
                  await page.waitForSelector('.islandStudio.open', { timeout: 10000 });
                  await page.waitForTimeout(700);
                  await capture(page, `island-studio-${t.name}-fold`);
                  await page.evaluate(() => document.querySelector('.islandStudio')?.classList.remove('open'));
                } catch (err) {
                  stateErrors.push('island-studio-state: ' + String(err));
                }
              }

              await page.evaluate(() => document.querySelector('#variantLab')?.classList.remove('open'));
            } catch (err) {
              stateErrors.push('variant-lab-state: ' + String(err));
            }

            const layout = await page.evaluate(() => {
              const rect = sel => {
                const el = document.querySelector(sel);
                if (!el) return null;
                const r = el.getBoundingClientRect();
                return { x:r.x, y:r.y, width:r.width, height:r.height };
              };
              const firstCard = document.querySelector('#grid .card');
              return {
                viewport: { width: innerWidth, height: innerHeight },
                bodyHeight: document.documentElement.scrollHeight,
                scrollWidth: document.documentElement.scrollWidth,
                horizontalOverflow: document.documentElement.scrollWidth > innerWidth + 1,
                header: rect('.top'),
                title: rect('.title'),
                controls: rect('.controls'),
                filters: rect('.filterRow'),
                bottomBar: rect('.bottom'),
                firstCard: firstCard ? rect('#grid .card') : null
              };
            });

            fs.writeFileSync(
              `${out}/diagnostics-${t.name}.json`,
              JSON.stringify({
                url: page.url(),
                viewport: t,
                title: await page.title(),
                consoleErrors,
                pageErrors,
                stateErrors,
                layout
              }, null, 2)
            );

            await page.close();
          }

          for (const t of targets) {
            const page = await browser.newPage({
              viewport: { width: t.width, height: t.height },
              deviceScaleFactor: 1
            });
            const errors = [];
            page.on('pageerror', err => errors.push(String(err)));
            try {
              await openReady(page, base + 'model-studio/?visualReview=' + Date.now(), 'body');
              await capture(page, `model-studio-${t.name}-fold`);
            } catch (err) {
              errors.push(String(err));
            }
            fs.writeFileSync(
              `${out}/model-studio-diagnostics-${t.name}.json`,
              JSON.stringify({ url: page.url(), title: await page.title(), errors }, null, 2)
            );
            await page.close();
          }

          await browser.close();
          EOF
          node capture.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: mts-visual-review
          path: visual-review/*
          retention-days: 7
