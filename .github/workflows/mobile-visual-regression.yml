name: Mobile UI visual regression
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'js/app.js'
      - 'tests/mobile-visual-regression.mjs'
      - '.github/workflows/mobile-visual-regression.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install screenshot browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Serve production files
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/mts-http.log 2>&1 &
      - name: Capture and assert mobile layouts
        run: node tests/mobile-visual-regression.mjs
      - name: Upload screenshots (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ui-screenshots
          path: artifacts/mobile-ui/
          if-no-files-found: warn

      - name: Save latest screenshots to repository
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p docs/visual-regression/mobile
          cp artifacts/mobile-ui/01-single.png docs/visual-regression/mobile/01-single.png
          cp artifacts/mobile-ui/02-three-by-three.png docs/visual-regression/mobile/02-three-by-three.png
          cp artifacts/mobile-ui/03-nine-by-nine.png docs/visual-regression/mobile/03-nine-by-nine.png
          printf 'Source commit: %s\n' "$GITHUB_SHA" > docs/visual-regression/mobile/README.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/visual-regression/mobile
          if ! git diff --cached --quiet; then
            git commit -m 'test: update latest mobile visual screenshots [skip ci]'
            git push origin HEAD:main
          fi
